name: Build & Release Obsidian Calc APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ObsidianCalc.apk

      - name: Upload Obsidian Calc APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianCalc-APK
          path: ObsidianCalc.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Obsidian Calc v1.0.0 (Android APK)"
          body: "Direct Android APK download for Obsidian Calc Scientific Calculator."
          files: ObsidianCalc.apk
          prerelease: false
